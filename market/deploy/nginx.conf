server {
    listen 80;
    server_name lingpet.fourzkw.top;
    client_max_body_size 64k;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = /api/admin/releases/upload {
        client_max_body_size 1100m;
        client_body_timeout 900s;
        proxy_pass http://127.0.0.1:9633;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
    location / {
        proxy_pass http://127.0.0.1:9633;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }
}
# After DNS is ready, provision HTTPS using your ACME client.
# Example on a machine with Certbot's Nginx integration:
# sudo certbot --nginx -d lingpet.fourzkw.top

