<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="theme-initial.js"></script><title>桌宠快捷栏</title><link rel="stylesheet" href="quick-controls.css"><link rel="stylesheet" href="quick-theme.css"></head><body>
