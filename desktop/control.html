<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>灵伴 · 桌宠控制</title><link rel="stylesheet" href="control.css"><script src="control.js" defer></script></head>
<body><main><div class="brand">灵伴 · 桌宠控制</div><h1>你的会话伙伴</h1><p class="intro">启动你的桌面伙伴，在工作台管理形象、显示与会话跟随。</p><section><div class="status"><span id="dot"></span><strong id="status" role="status">正在连接…</strong></div><p id="detail">正在检查桌宠运行状态</p><progress id="runtimeProgress" max="100" aria-label="Electron 准备进度" hidden></progress><div class="actions"><button id="start" disabled>启动桌宠</button><button id="stop" class="secondary" disabled>关闭全部桌宠</button><button id="settings" class="secondary" disabled>打开工作台</button></div></section><p id="message" role="status" aria-live="polite"></p><footer>关闭全部桌宠后，会话事件不会自动重启它。保留此面板即可再次启动。</footer></main></body></html>
